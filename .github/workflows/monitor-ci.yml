name: Monitor Worker CI

on:
  pull_request:
    paths:
      - "apps/monitor-worker/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/monitor-ci.yml"
      - ".github/workflows/monitor-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/monitor-worker typecheck
      - run: pnpm -C apps/monitor-worker test
      - run: pnpm -C apps/monitor-worker exec wrangler deploy --dry-run
