name: API CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/sync-api-lockfile.mjs"
      - ".github/workflows/api-ci.yml"
      - ".github/actions/detect-affected/action.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/sync-api-lockfile.mjs"
      - ".github/workflows/api-ci.yml"
      - ".github/actions/detect-affected/action.yml"

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      api-affected: ${{ steps.affected.outputs.affected }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - id: affected
        uses: ./.github/actions/detect-affected
        with:
          package-dir: apps/api
          full-run-paths: .github/workflows/api-ci.yml .github/actions/detect-affected/action.yml packages/vault-crypto scripts/sync-api-lockfile.mjs

  api:
    needs: detect
    if: needs.detect.outputs.api-affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:api-lockfile

      - run: pnpm -C apps/api check:public

      - run: pnpm -C apps/api typecheck

      - run: pnpm -C apps/api test:unit

      - run: pnpm -C apps/api test:e2e:node

      - run: pnpm -C apps/api test:integration:cloudflare
        env:
          BETTER_AUTH_URL: http://127.0.0.1:8787
          BETTER_AUTH_SECRET: ci-better-auth-secret-that-is-long-enough
          SYNC_TOKEN_SECRET: ci-sync-token-secret-that-is-long-enough

      - name: Build Node artifact
        run: pnpm -C apps/api build:node

      - name: Build Cloudflare community artifact
        run: pnpm -C apps/api build:cloudflare:community

      - name: Verify standalone Cloudflare template
        run: |
          template_dir="$(mktemp -d)"
          trap 'rm -rf "$template_dir"' EXIT
          tar \
            --exclude=node_modules \
            --exclude=.wrangler \
            --exclude=dist \
            -C apps/api -cf - . | tar -C "$template_dir" -xf -
          pnpm --dir "$template_dir" install --frozen-lockfile
          pnpm --dir "$template_dir" run build:cloudflare:community

      - name: Build Cloudflare managed artifact
        run: pnpm -C apps/api build:cloudflare:managed

      - name: Build Docker image
        run: docker build -f apps/api/Dockerfile -t synch-api:ci .

      - name: Smoke test Docker image
        run: |
          docker run --detach --name synch-api-smoke \
            --publish 127.0.0.1:8787:8787 \
            --env PUBLIC_URL=http://127.0.0.1:8787 \
            --env BETTER_AUTH_SECRET=ci-better-auth-secret-that-is-long-enough \
            --env SYNC_TOKEN_SECRET=ci-sync-token-secret-that-is-long-enough \
            --env AUTH_ALLOWED_EMAILS=ci@example.com \
            synch-api:ci
          cleanup() { docker rm --force synch-api-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs synch-api-smoke
          exit 1
