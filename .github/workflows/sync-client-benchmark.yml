name: Sync Benchmark

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [quick, full]
        default: quick
        description: Benchmark workload suite

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        contains(github.event.comment.body, '@synch bench') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    concurrency:
      group: sync-benchmark-${{ github.event.issue.number || github.ref }}-${{ matrix.runtime }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, cloudflare]
    env:
      SUITE: ${{ inputs.suite || (contains(github.event.comment.body, '@synch bench full') && 'full') || 'quick' }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.issue.number && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare base and candidate with identical measurement definitions
        run: >-
          pnpm bench:sync:compare --
          --base HEAD^1 --candidate HEAD
          --runtime "${{ matrix.runtime }}" --suite "$SUITE"
          --output "$RUNNER_TEMP/sync-benchmark-${{ matrix.runtime }}.json"
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-benchmark-${{ matrix.runtime }}
          path: ${{ runner.temp }}/sync-benchmark-${{ matrix.runtime }}.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: always() && needs.benchmark.result != 'skipped' && github.event_name == 'issue_comment'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout trusted report formatter
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: sync-benchmark-*
          merge-multiple: true
          path: ${{ runner.temp }}/sync-benchmark
      - name: Validate and format reports
        id: format
        continue-on-error: true
        run: node .github/scripts/format-sync-client-benchmark.mjs "$RUNNER_TEMP/sync-benchmark" "$RUNNER_TEMP/sync-benchmark-comment.md"
      - name: Publish benchmark result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- synch-sync-client-benchmark -->")) | .id' | tail -n 1)"
          comment_body="$(cat "$RUNNER_TEMP/sync-benchmark-comment.md")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$comment_body"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$comment_body"
          fi
      - name: Fail on missing or invalid reports
        if: steps.format.outcome == 'failure' || needs.benchmark.result != 'success'
        run: exit 1
