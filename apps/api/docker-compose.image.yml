# Standalone configuration. Do not merge with docker-compose.yml: that file
# intentionally keeps the original source-build workflow.
name: synch

services:
  synch-api:
    image: ${SYNCH_IMAGE:-ghcr.io/hjinco/synch-api:latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
    volumes:
      - synch-data:/data

volumes:
  synch-data:
