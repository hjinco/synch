<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Authorize device | Synch</title>
		<link rel="stylesheet" href="/styles.css" />
		<script src="/i18n.js"></script>
	</head>
	<body>
		<div class="page page--medium">
			<div class="page-header">
				<a href="https://synch.run/" class="brand">Synch</a>
				<h1 class="page-title" data-i18n="title">Finish Synch sign-in in Obsidian</h1>
				<p class="page-subtitle" data-i18n="subtitle">Approve the sign-in request opened by the Synch Obsidian plugin.</p>
				<p class="page-subtitle" data-i18n="hint">Only continue if you just chose "Sign in on this device" in Obsidian.</p>
			</div>

			<div id="status" class="status status--spaced" aria-live="polite"></div>
			<p id="identity" class="identity" hidden></p>

			<div id="approval-panel" class="approval-panel" hidden>
				<button id="approve-button" type="button" class="btn btn--primary btn--block">
					<span data-i18n="approve">Allow Obsidian sign-in</span>
				</button>
				<button id="deny-button" type="button" class="btn btn--secondary btn--block">
					<span data-i18n="deny">Cancel request</span>
				</button>
			</div>
		</div>

		<script>
			// Inline English doubles as the initial render and the fallback
			// catalog; other locales are fetched from /i18n/<locale>.json.
			const { createTranslator } = window.synchI18n;
			const { t, ready: translationsReady } = createTranslator("device", {
				pageTitle: "Finish Obsidian sign-in",
				title: "Finish Synch sign-in in Obsidian",
				subtitle: "Approve the sign-in request opened by the Synch Obsidian plugin.",
				hint: "Only continue if you just chose \"Sign in on this device\" in Obsidian.",
				approve: "Allow Obsidian sign-in",
				deny: "Cancel request",
				checkingSession: "Checking session...",
				loggedInAs: "Logged in as {account}",
				openFromObsidian: "Start sign-in from Synch inside Obsidian, then use the page it opens.",
				checkingDevice: "Checking the Obsidian sign-in request...",
				approved: "Obsidian sign-in was allowed. Return to Obsidian to finish.",
				denied: "The Obsidian sign-in request was canceled.",
				invalidOrConsumed: "This sign-in request is invalid or has already been used.",
				approveToFinish: "Allow this request to sign in the Synch plugin in Obsidian.",
				unableToLoad: "Unable to load the Obsidian sign-in request.",
				unableToCheckSession: "Unable to check your session.",
				invalidCode: "This sign-in request is invalid.",
				approving: "Allowing Obsidian sign-in...",
				denying: "Canceling sign-in request...",
				unableToUpdate: "Unable to update the Obsidian sign-in request.",
				apiUnavailableWithHint: "Unable to reach the API. Check the server URL and try again.",
				requestFailed: "Request failed.",
			});
			const params = new URLSearchParams(window.location.search);
			let activeUserCode = normalizeUserCode(params.get("user_code") ?? "");

			const approvalPanel = document.querySelector("#approval-panel");
			const approveButton = document.querySelector("#approve-button");
			const denyButton = document.querySelector("#deny-button");
			const identity = document.querySelector("#identity");
			const status = document.querySelector("#status");

			approveButton?.addEventListener("click", () => {
				void submitDeviceDecision("approve");
			});

			denyButton?.addEventListener("click", () => {
				void submitDeviceDecision("deny");
			});

			applyTranslations();
			// Wait for the locale catalog before the first dynamic render so
			// status text set by the page flow never sticks in English.
			void translationsReady.then(() => {
				applyTranslations();
				void refreshDevice();
			});

			async function refreshDevice() {
				setVisible(approvalPanel, false);
				setVisible(identity, false);

				setStatus(t("checkingSession"));
				try {
					const session = await getSession();
					const accountLabel = session?.user?.email || session?.user?.name || "";

					if (!accountLabel) {
						redirectToSignIn();
						return;
					}

					identity.textContent = t("loggedInAs", { account: accountLabel });
					setVisible(identity, true);

					if (!activeUserCode) {
						setStatus(t("openFromObsidian"));
						return;
					}

					setStatus(t("checkingDevice"));
					const deviceStatus = await getDeviceStatus();

					if (deviceStatus === "approved") {
						setStatus(t("approved"), "success");
						return;
					}
					if (deviceStatus === "denied") {
						setStatus(t("denied"), "error");
						return;
					}
					if (deviceStatus !== "pending") {
						setStatus(t("invalidOrConsumed"), "error");
						return;
					}

					setVisible(approvalPanel, true);
					setStatus(t("approveToFinish"));
				} catch (error) {
					setStatus(error instanceof Error ? error.message : t("unableToLoad"), "error");
				}
			}

			async function getSession() {
				const response = await fetchApi("/api/auth/get-session");
				if (response.status === 401 || response.status === 403) {
					return null;
				}
				if (!response.ok) {
					throw new Error(await readErrorMessage(response, t("unableToCheckSession")));
				}
				return await response.json();
			}

			async function getDeviceStatus() {
				const response = await fetchApi(
					`/api/auth/device?user_code=${encodeURIComponent(activeUserCode)}`,
				);
				if (!response.ok) {
					throw new Error(await readErrorMessage(response, t("invalidCode")));
				}
				const json = await response.json();
				return json.status;
			}

			async function submitDeviceDecision(decision) {
				if (!activeUserCode) {
					return;
				}

				setActionButtonsDisabled(true);
				setStatus(decision === "approve" ? t("approving") : t("denying"));
				try {
					const response = await fetchApi(`/api/auth/device/${decision}`, {
						method: "POST",
						headers: {
							"content-type": "application/json",
						},
						body: JSON.stringify({ userCode: activeUserCode }),
					});

					if (!response.ok) {
						setStatus(await readErrorMessage(response, t("unableToUpdate")), "error");
						return;
					}

					setVisible(approvalPanel, false);
					setStatus(
						decision === "approve"
							? t("approved")
							: t("denied"),
						decision === "approve" ? "success" : "error",
					);
				} catch {
					setStatus(t("apiUnavailableWithHint"), "error");
				} finally {
					setActionButtonsDisabled(false);
				}
			}

			function fetchApi(path, init = {}) {
				return fetch(path, {
					credentials: "include",
					...init,
					headers: {
						...(init.headers ?? {}),
					},
				});
			}

			function redirectToSignIn() {
				const signInUrl = new URL("/signin", window.location.origin);
				signInUrl.searchParams.set("return_to", window.location.href);
				const lang = new URLSearchParams(window.location.search).get("lang");
				if (lang) {
					signInUrl.searchParams.set("lang", lang);
				}
				window.location.assign(signInUrl.toString());
			}

			function applyTranslations() {
				for (const element of document.querySelectorAll("[data-i18n]")) {
					element.textContent = t(element.dataset.i18n);
				}
				document.title = `${t("pageTitle")} | Synch`;
			}

			function setStatus(message, tone = inferTone(message)) {
				status.classList.remove("status--error", "status--success");
				const toneClass = statusClassForTone(tone);
				if (toneClass) {
					status.classList.add(toneClass);
				}
				status.textContent = message;
			}

			function inferTone(message) {
				const lower = message.toLowerCase();
				if (
					lower.includes("failed") ||
					lower.includes("unable") ||
					lower.includes("invalid") ||
					lower.includes("denied") ||
					lower.includes("error")
				) {
					return "error";
				}
				if (
					lower.includes("sent") ||
					lower.includes("authenticated") ||
					lower.includes("approved") ||
					lower.includes("logged in")
				) {
					return "success";
				}
				return "neutral";
			}

			function statusClassForTone(tone) {
				if (tone === "error") {
					return "status--error";
				}
				if (tone === "success") {
					return "status--success";
				}
				return "";
			}

			function setVisible(element, visible) {
				element.hidden = !visible;
			}

			function setActionButtonsDisabled(disabled) {
				approveButton.disabled = disabled;
				denyButton.disabled = disabled;
			}

			async function readErrorMessage(response, fallback = t("requestFailed")) {
				try {
					const json = await response.json();
					return json.message || json.error_description || json.error || fallback;
				} catch {
					return fallback;
				}
			}

			function normalizeUserCode(value) {
				return value.trim().replaceAll("-", "").toUpperCase();
			}
		</script>
	</body>
</html>
