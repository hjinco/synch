<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Sign Up - Synch</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="/i18n.js"></script>
		<style>
			/* Mimic the selection colors from Layout.astro */
			::selection {
				background-color: #27272a;
				color: #e4e4e7;
			}
		</style>
	</head>
	<body class="bg-[#0a0a0a] text-zinc-400 font-sans antialiased min-h-screen flex flex-col text-sm">
		<div class="max-w-md mx-auto px-6 w-full flex-1 flex flex-col justify-center py-24">
			<div class="mb-8 text-center">
				<a href="https://synch.run/" class="text-zinc-200 font-normal tracking-wider text-xs uppercase hover:opacity-80 transition-opacity inline-block mb-8">Synch</a>
				<h1 class="text-2xl text-zinc-200 tracking-tight mb-2" data-i18n="title">Create an account</h1>
				<p class="text-zinc-500 text-xs" data-i18n="subtitle">Your vault stays end-to-end encrypted. This account only coordinates sync.</p>
			</div>

			<form id="sign-up-form" class="space-y-4">
				<div class="space-y-2">
					<label for="name" class="block text-xs text-zinc-400" data-i18n="name">Name</label>
					<input type="text" id="name" name="name" required autocomplete="name" class="w-full bg-zinc-900/50 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600 transition-colors" placeholder="John Doe" />
				</div>

				<div class="space-y-2">
					<label for="email" class="block text-xs text-zinc-400" data-i18n="email">Email</label>
					<input type="email" id="email" name="email" required autocomplete="email" class="w-full bg-zinc-900/50 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600 transition-colors" placeholder="you@example.com" />
				</div>
				
				<div class="space-y-2">
					<label for="password" class="block text-xs text-zinc-400" data-i18n="password">Password</label>
					<input type="password" id="password" name="password" required autocomplete="new-password" class="w-full bg-zinc-900/50 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-zinc-600 transition-colors" placeholder="••••••••" />
				</div>

				<div id="status" class="text-zinc-400 text-xs text-center min-h-6" aria-live="polite"></div>

				<button type="submit" class="w-full py-2 px-4 mt-4 text-center text-xs bg-zinc-200 text-[#0a0a0a] hover:bg-white rounded transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed" data-i18n="submit">
					Create Account
				</button>

				<div id="success-container" class="hidden mt-6 p-4 bg-zinc-900/50 border border-zinc-800/80 rounded-lg text-center flex-col items-center">
					<div class="text-zinc-200 text-sm mb-1" data-i18n="checkEmail">Check your email</div>
					<div class="text-zinc-400 text-xs mb-4"><span data-i18n="sentPrefix">We've sent a verification link to</span> <span id="sent-email-display" class="font-medium text-zinc-300"></span><span data-i18n="sentSuffix">.</span></div>
					
					<div id="resend-container" class="text-center flex-col items-center w-full">
						<button id="resend-button" type="button" class="text-xs text-zinc-300 hover:text-white underline transition-colors disabled:opacity-50 disabled:no-underline disabled:cursor-not-allowed" data-i18n="resendVerification">
							Resend verification email
						</button>
						<div id="resend-message" class="text-xs mt-2 text-zinc-400 hidden"></div>
					</div>
				</div>
			</form>

			<div class="mt-8 text-center text-xs text-zinc-500">
				<span data-i18n="hasAccount">Already have an account?</span> <a id="signin-link" href="/signin" class="text-zinc-300 hover:text-zinc-100 transition-colors" data-i18n="signIn">Sign in</a>
			</div>
		</div>

		<script>
			// Inline English doubles as the initial render and the fallback
			// catalog; other locales are fetched from /i18n/<locale>.json.
			const { locale, createTranslator } = window.synchI18n;
			const { t, ready: translationsReady } = createTranslator("signup", {
				title: "Create an account",
				subtitle: "Your vault stays end-to-end encrypted. This account only coordinates sync.",
				name: "Name",
				email: "Email",
				password: "Password",
				submit: "Create Account",
				checkEmail: "Check your email",
				sentPrefix: "We've sent a verification link to",
				sentSuffix: ".",
				resendVerification: "Resend verification email",
				hasAccount: "Already have an account?",
				signIn: "Sign in",
				resendAvailableIn: "Resend available in {seconds}s",
				sending: "Sending...",
				failedToResend: "Failed to resend",
				resent: "Verification email resent.",
				apiUnavailable: "Unable to reach the API.",
				apiUnavailableWithHint: "Unable to reach the API. Check the server URL and try again.",
				creatingAccount: "Creating account...",
				accountCreationFailed: "Account creation failed.",
				emailNotAllowed: "This email address is not allowed to sign up.",
				emailSent: "Email Sent",
				createdRedirecting: "Account created. Redirecting...",
				requestFailed: "Request failed.",
			});
			const form = document.querySelector("#sign-up-form");
			const status = document.querySelector("#status");
			const signinLink = document.querySelector("#signin-link");
			const successContainer = document.querySelector("#success-container");
			const sentEmailDisplay = document.querySelector("#sent-email-display");
			const resendButton = document.querySelector("#resend-button");
			const resendMessage = document.querySelector("#resend-message");
			let returnTo = "";
			
			let isSuccessState = false;
			let resendCooldown = 0;
			let resendInterval;
			let currentEmail = "";

			applyTranslations();
			// Wait for the locale catalog before the first dynamic render so
			// status text set by the page flow never sticks in English.
			void translationsReady.then(() => {
				applyTranslations();
				void initializePage();
			});

			function startResendCooldown() {
				if (!resendButton) return;
				resendCooldown = 30;
				resendButton.disabled = true;
				
				if (resendInterval) clearInterval(resendInterval);
				
				resendInterval = setInterval(() => {
					resendCooldown -= 1;
					if (resendCooldown <= 0) {
						clearInterval(resendInterval);
						resendButton.disabled = false;
						resendButton.textContent = t("resendVerification");
					} else {
						resendButton.textContent = t("resendAvailableIn", { seconds: resendCooldown });
					}
				}, 1000);
			}

			resendButton?.addEventListener("click", async () => {
				if (resendCooldown > 0 || !currentEmail) return;
				
				resendButton.disabled = true;
				if (resendMessage) {
					resendMessage.textContent = t("sending");
					resendMessage.classList.remove("hidden", "text-red-400");
					resendMessage.classList.add("text-zinc-400");
				}

				try {
					const response = await fetch("/api/auth/send-verification-email", {
						method: "POST",
						credentials: "include",
						headers: {
							"content-type": "application/json",
						},
						body: JSON.stringify({ 
							email: currentEmail,
							callbackURL: returnTo || "/",
						}),
					});

					if (!response.ok) {
						if (resendMessage) {
							resendMessage.textContent = await readErrorMessage(response, t("failedToResend"));
							resendMessage.classList.remove("text-zinc-400");
							resendMessage.classList.add("text-red-400");
						}
						resendButton.disabled = false;
						return;
					}

					if (resendMessage) {
						resendMessage.textContent = t("resent");
						resendMessage.classList.remove("text-red-400");
						resendMessage.classList.add("text-zinc-400");
					}
					startResendCooldown();
				} catch {
					if (resendMessage) {
						resendMessage.textContent = t("apiUnavailable");
						resendMessage.classList.remove("text-zinc-400");
						resendMessage.classList.add("text-red-400");
					}
					resendButton.disabled = false;
				}
			});

			form?.addEventListener("submit", (event) => {
				event.preventDefault();
				void submitAuth();
			});

			function applyTranslations() {
				for (const element of document.querySelectorAll("[data-i18n]")) {
					element.textContent = t(element.dataset.i18n);
				}
				document.title = `${t("submit")} - Synch`;
			}

			async function initializePage() {
				returnTo = loadReturnTo();
				if (signinLink && returnTo) {
					const signinUrl = new URL("/signin", window.location.origin);
					signinUrl.searchParams.set("return_to", returnTo);
					signinUrl.searchParams.set("lang", locale);
					signinLink.href = signinUrl.toString();
				}
			}

			function loadReturnTo() {
				const params = new URLSearchParams(window.location.search);
				const requested = params.get("return_to") || params.get("callbackURL") || "";
				const fallback = new URL("/vaults", window.location.origin);
				fallback.searchParams.set("lang", locale);
				if (!requested.trim()) {
					return fallback.toString();
				}

				try {
					const parsed = new URL(requested, window.location.href);
					return parsed.origin === window.location.origin ? parsed.toString() : fallback.toString();
				} catch {
					return fallback.toString();
				}
			}

			async function submitAuth() {
				const body = Object.fromEntries(new FormData(form).entries());
				body.callbackURL = returnTo || "/";
				setSubmitting(true);
				setStatus(t("creatingAccount"));
				try {
					const response = await fetch("/api/auth/sign-up/email", {
						method: "POST",
						credentials: "include",
						headers: {
							"content-type": "application/json",
						},
						body: JSON.stringify(body),
					});

					if (!response.ok) {
						setStatus(await readErrorMessage(response, t("accountCreationFailed")), true);
						return;
					}

					const result = await readJson(response);
					if (result && result.token === null) {
						isSuccessState = true;
						setStatus("");
						
						for (const element of form.elements) {
							if (element.id === "resend-button") continue;
							if (element instanceof HTMLInputElement || element instanceof HTMLButtonElement) {
								element.disabled = true;
							}
						}
						
						const submitBtn = form.querySelector('button[type="submit"]');
						if (submitBtn) {
							submitBtn.textContent = t("emailSent");
							submitBtn.classList.remove("bg-zinc-200", "text-[#0a0a0a]", "hover:bg-white");
							submitBtn.classList.add("bg-zinc-800", "text-zinc-400");
						}

						currentEmail = body.email;
						if (sentEmailDisplay) sentEmailDisplay.textContent = currentEmail;
						
						if (successContainer) {
							successContainer.classList.remove("hidden");
							successContainer.classList.add("flex");
						}
						startResendCooldown();
						return;
					}

					setStatus(t("createdRedirecting"));
					window.location.assign(returnTo || "/");
				} catch {
					setStatus(t("apiUnavailableWithHint"), true);
				} finally {
					setSubmitting(false);
				}
			}

			function setStatus(message, isError = false) {
				if (status.classList.contains("text-red-400")) {
					status.classList.remove("text-red-400");
					status.classList.add("text-zinc-400");
				}
				status.textContent = message;
				if (isError) {
					status.classList.remove("text-zinc-400");
					status.classList.add("text-red-400");
				}
			}

			function setSubmitting(submitting) {
				if (isSuccessState) return;
				for (const element of form.elements) {
					if (element.id === "resend-button") continue;
					if (element instanceof HTMLInputElement || element instanceof HTMLButtonElement) {
						element.disabled = submitting;
					}
				}
			}

			async function readErrorMessage(response, fallback = t("requestFailed")) {
				try {
					const json = await response.json();
					if (json.code === "SIGN_UP_EMAIL_NOT_ALLOWED") return t("emailNotAllowed");
					return json.message || json.error_description || json.error || fallback;
				} catch {
					return fallback;
				}
			}

			async function readJson(response) {
				try {
					return await response.json();
				} catch {
					return null;
				}
			}
		</script>
	</body>
</html>
