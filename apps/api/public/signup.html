<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Sign Up - Synch</title>
		<link rel="stylesheet" href="/styles.css" />
		<script src="/i18n.js"></script>
	</head>
	<body>
		<div class="page page--narrow">
			<div class="page-header">
				<a href="https://synch.run/" class="brand">Synch</a>
				<h1 class="page-title" data-i18n="title">Create an account</h1>
				<p class="page-subtitle" data-i18n="subtitle">Your vault stays end-to-end encrypted. This account only coordinates sync.</p>
			</div>

			<form id="sign-up-form" class="form">
				<div class="field">
					<label for="name" class="label" data-i18n="name">Name</label>
					<input type="text" id="name" name="name" required autocomplete="name" class="input" placeholder="John Doe" />
				</div>

				<div class="field">
					<label for="email" class="label" data-i18n="email">Email</label>
					<input type="email" id="email" name="email" required autocomplete="email" class="input" placeholder="you@example.com" />
				</div>
				
				<div class="field">
					<label for="password" class="label" data-i18n="password">Password</label>
					<input type="password" id="password" name="password" required autocomplete="new-password" class="input" placeholder="••••••••" />
				</div>

				<div id="status" class="status" aria-live="polite"></div>

				<button type="submit" class="btn btn--primary btn--block" data-i18n="submit">
					Create Account
				</button>

				<div id="success-container" class="success-panel hidden">
					<div class="success-title" data-i18n="checkEmail">Check your email</div>
					<div class="success-body"><span data-i18n="sentPrefix">We've sent a verification link to</span> <span id="sent-email-display" class="sent-email"></span><span data-i18n="sentSuffix">.</span></div>
					
					<div id="resend-container" class="resend">
						<button id="resend-button" type="button" class="link-button" data-i18n="resendVerification">
							Resend verification email
						</button>
						<div id="resend-message" class="resend-message hidden"></div>
					</div>
				</div>
			</form>

			<div class="auth-footer">
				<span data-i18n="hasAccount">Already have an account?</span> <a id="signin-link" href="/signin" data-i18n="signIn">Sign in</a>
			</div>
		</div>

		<script>
			// Inline English doubles as the initial render and the fallback
			// catalog; other locales are fetched from /i18n/<locale>.json.
			const { locale, createTranslator } = window.synchI18n;
			const { t, ready: translationsReady } = createTranslator("signup", {
				title: "Create an account",
				subtitle: "Your vault stays end-to-end encrypted. This account only coordinates sync.",
				name: "Name",
				email: "Email",
				password: "Password",
				submit: "Create Account",
				checkEmail: "Check your email",
				sentPrefix: "We've sent a verification link to",
				sentSuffix: ".",
				resendVerification: "Resend verification email",
				hasAccount: "Already have an account?",
				signIn: "Sign in",
				resendAvailableIn: "Resend available in {seconds}s",
				sending: "Sending...",
				failedToResend: "Failed to resend",
				resent: "Verification email resent.",
				apiUnavailable: "Unable to reach the API.",
				apiUnavailableWithHint: "Unable to reach the API. Check the server URL and try again.",
				creatingAccount: "Creating account...",
				accountCreationFailed: "Account creation failed.",
				emailNotAllowed: "This email address is not allowed to sign up.",
				emailSent: "Email Sent",
				createdRedirecting: "Account created. Redirecting...",
				requestFailed: "Request failed.",
			});
			const form = document.querySelector("#sign-up-form");
			const status = document.querySelector("#status");
			const signinLink = document.querySelector("#signin-link");
			const successContainer = document.querySelector("#success-container");
			const sentEmailDisplay = document.querySelector("#sent-email-display");
			const resendButton = document.querySelector("#resend-button");
			const resendMessage = document.querySelector("#resend-message");
			let returnTo = "";
			
			let isSuccessState = false;
			let resendCooldown = 0;
			let resendInterval;
			let currentEmail = "";

			applyTranslations();
			// Wait for the locale catalog before the first dynamic render so
			// status text set by the page flow never sticks in English.
			void translationsReady.then(() => {
				applyTranslations();
				void initializePage();
			});

			function startResendCooldown() {
				if (!resendButton) return;
				resendCooldown = 30;
				resendButton.disabled = true;
				
				if (resendInterval) clearInterval(resendInterval);
				
				resendInterval = setInterval(() => {
					resendCooldown -= 1;
					if (resendCooldown <= 0) {
						clearInterval(resendInterval);
						resendButton.disabled = false;
						resendButton.textContent = t("resendVerification");
					} else {
						resendButton.textContent = t("resendAvailableIn", { seconds: resendCooldown });
					}
				}, 1000);
			}

			resendButton?.addEventListener("click", async () => {
				if (resendCooldown > 0 || !currentEmail) return;
				
				resendButton.disabled = true;
				if (resendMessage) {
					resendMessage.textContent = t("sending");
					resendMessage.classList.remove("hidden", "status--error");
				}

				try {
					const response = await fetch("/api/auth/send-verification-email", {
						method: "POST",
						credentials: "include",
						headers: {
							"content-type": "application/json",
						},
						body: JSON.stringify({ 
							email: currentEmail,
							callbackURL: returnTo || "/",
						}),
					});

					if (!response.ok) {
						if (resendMessage) {
							resendMessage.textContent = await readErrorMessage(response, t("failedToResend"));
							resendMessage.classList.add("status--error");
						}
						resendButton.disabled = false;
						return;
					}

					if (resendMessage) {
						resendMessage.textContent = t("resent");
						resendMessage.classList.remove("status--error");
					}
					startResendCooldown();
				} catch {
					if (resendMessage) {
						resendMessage.textContent = t("apiUnavailable");
						resendMessage.classList.add("status--error");
					}
					resendButton.disabled = false;
				}
			});

			form?.addEventListener("submit", (event) => {
				event.preventDefault();
				void submitAuth();
			});

			function applyTranslations() {
				for (const element of document.querySelectorAll("[data-i18n]")) {
					element.textContent = t(element.dataset.i18n);
				}
				document.title = `${t("submit")} - Synch`;
			}

			async function initializePage() {
				returnTo = loadReturnTo();
				if (signinLink && returnTo) {
					const signinUrl = new URL("/signin", window.location.origin);
					signinUrl.searchParams.set("return_to", returnTo);
					signinUrl.searchParams.set("lang", locale);
					signinLink.href = signinUrl.toString();
				}
			}

			function loadReturnTo() {
				const params = new URLSearchParams(window.location.search);
				const requested = params.get("return_to") || params.get("callbackURL") || "";
				const fallback = new URL("/vaults", window.location.origin);
				fallback.searchParams.set("lang", locale);
				if (!requested.trim()) {
					return fallback.toString();
				}

				try {
					const parsed = new URL(requested, window.location.href);
					return parsed.origin === window.location.origin ? parsed.toString() : fallback.toString();
				} catch {
					return fallback.toString();
				}
			}

			async function submitAuth() {
				const body = Object.fromEntries(new FormData(form).entries());
				body.callbackURL = returnTo || "/";
				setSubmitting(true);
				setStatus(t("creatingAccount"));
				try {
					const response = await fetch("/api/auth/sign-up/email", {
						method: "POST",
						credentials: "include",
						headers: {
							"content-type": "application/json",
						},
						body: JSON.stringify(body),
					});

					if (!response.ok) {
						setStatus(await readErrorMessage(response, t("accountCreationFailed")), true);
						return;
					}

					const result = await readJson(response);
					if (result && result.token === null) {
						isSuccessState = true;
						setStatus("");
						
						for (const element of form.elements) {
							if (element.id === "resend-button") continue;
							if (element instanceof HTMLInputElement || element instanceof HTMLButtonElement) {
								element.disabled = true;
							}
						}
						
						const submitBtn = form.querySelector('button[type="submit"]');
						if (submitBtn) {
							submitBtn.textContent = t("emailSent");
							submitBtn.classList.add("btn--muted");
						}

						currentEmail = body.email;
						if (sentEmailDisplay) sentEmailDisplay.textContent = currentEmail;
						
						if (successContainer) {
							successContainer.classList.remove("hidden");
						}
						startResendCooldown();
						return;
					}

					setStatus(t("createdRedirecting"));
					window.location.assign(returnTo || "/");
				} catch {
					setStatus(t("apiUnavailableWithHint"), true);
				} finally {
					setSubmitting(false);
				}
			}

			function setStatus(message, isError = false) {
				status.classList.toggle("status--error", isError);
				status.textContent = message;
			}

			function setSubmitting(submitting) {
				if (isSuccessState) return;
				for (const element of form.elements) {
					if (element.id === "resend-button") continue;
					if (element instanceof HTMLInputElement || element instanceof HTMLButtonElement) {
						element.disabled = submitting;
					}
				}
			}

			async function readErrorMessage(response, fallback = t("requestFailed")) {
				try {
					const json = await response.json();
					if (json.code === "SIGN_UP_EMAIL_NOT_ALLOWED") return t("emailNotAllowed");
					return json.message || json.error_description || json.error || fallback;
				} catch {
					return fallback;
				}
			}

			async function readJson(response) {
				try {
					return await response.json();
				} catch {
					return null;
				}
			}
		</script>
	</body>
</html>
